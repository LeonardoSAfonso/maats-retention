# Infraestrutura disponível no scaffold: Postgres.
#
# `docker compose up -d db` (ou `pnpm db:up`) inicia apenas o banco. A entrega
# deve incluir API e frontend, para que `docker compose up` inicie o fluxo completo.

services:
  db:
    image: postgres:17-alpine
    container_name: smart-retention-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_retention}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_retention}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
