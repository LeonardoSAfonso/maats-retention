# Hooks compartilhados pelo monorepo. Instale-os com `pnpm exec lefthook install` após clonar.
#
# O lint não roda no pre-commit: cada pacote tem seu `eslint.config.mjs` (flat config),
# e o ESLint executado na raiz pode escolher a configuração errada. O `pre-push`
# roda o pipeline completo.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,md,yaml,yml,css}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    verify:
      run: pnpm verify
